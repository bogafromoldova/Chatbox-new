<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ebe8f3;
    --panel: #f8f6fc;
    --ink: #17133a;
    --ink-soft: #5d5882;
    --line: #cfcae3;
    --signal: #ff5a2e;
    --user: #17133a;
    --code: #17133a;
    --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
  }
  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100%;
    max-width: 1180px;
    margin: 0 auto;
  }

  /* left rail */
  .rail {
    padding: 28px 24px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .brand {
    font-family: var(--display);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand span { color: var(--signal); }
  .rail label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .rail input[type=text] {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 6px;
  }
  .rail input[type=text]:focus { outline: 3px solid var(--signal); outline-offset: 1px; border-color: var(--ink); }
  .hint { font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; }
  .btn-ghost {
    font: inherit; font-weight: 600; font-size: 14px;
    color: var(--ink); background: transparent;
    border: 1.5px solid var(--ink); border-radius: 6px;
    padding: 9px 14px; cursor: pointer;
  }
  .btn-ghost:hover { background: var(--ink); color: var(--panel); }
  .btn-ghost:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

  /* conversation */
  .main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .empty {
    margin: auto 0;
    max-width: 30ch;
  }
  .empty h1 {
    font-family: var(--display);
    font-size: 44px;
    line-height: 1.02;
    letter-spacing: -0.03em;
    margin: 0 0 12px;
  }
  .empty p { margin: 0; color: var(--ink-soft); }

  .msg { max-width: 68ch; overflow-wrap: anywhere; }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    color: var(--panel);
    padding: 10px 16px;
    border-radius: 14px 14px 2px 14px;
    white-space: pre-wrap;
  }
  .msg.ai {
    align-self: flex-start;
    padding-left: 16px;
    border-left: 3px solid var(--signal);
    white-space: pre-wrap;
  }
  .msg.err {
    align-self: flex-start;
    padding: 10px 14px;
    background: #ffe7df;
    border-left: 3px solid var(--signal);
    border-radius: 2px 8px 8px 2px;
    color: #7a1f06;
  }
  .msg code {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.9em;
    background: rgba(23,19,58,.09);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .msg pre {
    background: var(--code);
    color: #efeaff;
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 10px 0;
    white-space: pre;
  }
  .msg pre code { background: none; padding: 0; color: inherit; }

  .typing { display: inline-flex; gap: 5px; padding: 6px 0 6px 16px; border-left: 3px solid var(--signal); align-self: flex-start; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: .35; animation: blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* composer */
  .composer {
    padding: 12px 40px 28px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    max-height: 180px;
    padding: 13px 16px;
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 12px;
  }
  .composer textarea:focus { outline: 3px solid var(--signal); outline-offset: 1px; border-color: var(--ink); }
  .send {
    font: inherit; font-weight: 600;
    background: var(--signal); color: #fff;
    border: none; border-radius: 12px;
    padding: 13px 22px; cursor: pointer;
  }
  .send:hover { background: #e84a1f; }
  .send:disabled { opacity: .5; cursor: not-allowed; }
  .send:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { flex-direction: row; flex-wrap: wrap; align-items: flex-end; gap: 14px; padding: 16px; border-right: none; border-bottom: 1px solid var(--line); }
    .rail .field { flex: 1 1 220px; }
    .hint { display: none; }
    .brand { font-size: 24px; }
    .log { padding: 20px 16px 8px; }
    .composer { padding: 10px 16px 18px; }
    .empty h1 { font-size: 34px; }
  }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">chat<span>box</span></div>
    <div class="field">
      <label for="model">Model</label>
      <input type="text" id="model" list="models" autocomplete="off" spellcheck="false">
      <datalist id="models">
        <option value="meta-llama/llama-3.3-70b-instruct:free">
        <option value="meta-llama/llama-3-8b-instruct:free">
        <option value="mistralai/mistral-7b-instruct:free">
        <option value="deepseek/deepseek-chat-v3-0324:free">
      </datalist>
      <p class="hint">Poți scrie orice ID de model de pe openrouter.ai/models. Dacă primești eroare, încearcă alt model.</p>
    </div>
    <button class="btn-ghost" id="clear" type="button">Conversație nouă</button>
  </aside>

  <main class="main">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Scrie un mesaj. Enter trimite, Shift+Enter rând nou." aria-label="Mesaj"></textarea>
      <button class="send" id="send" type="button">Trimite</button>
    </div>
  </main>
</div>

<script>
(function () {
  var log = document.getElementById('log');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var modelEl = document.getElementById('model');
  var clearBtn = document.getElementById('clear');
  var DEFAULT_MODEL = 'meta-llama/llama-3.3-70b-instruct:free';
  var chat = [];
  var busy = false;

  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  modelEl.value = load('chatbox.model') || DEFAULT_MODEL;
  modelEl.addEventListener('change', function () { save('chatbox.model', modelEl.value.trim()); });
  try { chat = JSON.parse(load('chatbox.chat') || '[]'); if (!Array.isArray(chat)) chat = []; } catch (e) { chat = []; }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // escape first, then allow only code blocks, inline code and bold
  function format(text) {
    var out = esc(text);
    out = out.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, function (_, c) { return '<pre><code>' + c.replace(/\n$/, '') + '</code></pre>'; });
    out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    return out;
  }

  function empty() {
    log.innerHTML = '<div class="empty"><h1>Ce vrei să afli?</h1><p>Alege un model în stânga și scrie primul mesaj.</p></div>';
  }
  function add(kind, text) {
    var empt = log.querySelector('.empty');
    if (empt) empt.remove();
    var d = document.createElement('div');
    d.className = 'msg ' + kind;
    if (kind === 'ai') d.innerHTML = format(text); else d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function render() {
    log.innerHTML = '';
    if (!chat.length) { empty(); return; }
    chat.forEach(function (m) { add(m.role === 'user' ? 'user' : 'ai', m.content); });
  }
  function typing(on) {
    var t = document.getElementById('typing');
    if (on && !t) {
      t = document.createElement('div');
      t.id = 'typing'; t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>';
      log.appendChild(t); log.scrollTop = log.scrollHeight;
    } else if (!on && t) { t.remove(); }
  }
  function grow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }

  async function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true;
    chat.push({ role: 'user', content: text });
    add('user', text);
    input.value = ''; grow();
    typing(true);

    try {
      var r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chat, model: modelEl.value.trim() || DEFAULT_MODEL })
      });
      var data = await r.json().catch(function () { return {}; });
      typing(false);
      var reply = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!reply) {
        var msg = (data && data.error && (data.error.message || data.error)) || ('Eroare ' + r.status);
        add('err', String(msg));
        chat.pop();
      } else {
        chat.push({ role: 'assistant', content: reply });
        add('ai', reply);
      }
    } catch (e) {
      typing(false);
      add('err', 'Nu s-a putut contacta serverul: ' + e.message);
      chat.pop();
    }
    save('chatbox.chat', JSON.stringify(chat));
    busy = false; sendBtn.disabled = false; input.focus();
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('input', grow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  clearBtn.addEventListener('click', function () {
    chat = []; save('chatbox.chat', '[]'); render(); input.focus();
  });

  render();
})();
</script>
</body>
</html>
